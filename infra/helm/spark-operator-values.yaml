# kubeflow/spark-operator chart 2.5.2
spark:
  jobNamespaces: [processing]
  serviceAccount:
    create: true
    name: spark
  rbac:
    create: true
controller:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
webhook:
  enable: true
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}
prometheus:
  metrics:
    enable: true
    port: 8080
    endpoint: /metrics
