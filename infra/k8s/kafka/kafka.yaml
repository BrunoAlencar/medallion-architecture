# Kafka 4.3.2 on Strimzi 1.3.1 (KRaft, kafka.strimzi.io/v1 only; v1beta2 is rejected).
# One dual-role node: fine for a POC, MSK or a 3-node pool on EKS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
data:
  # Condensed from Strimzi's examples/metrics/kafka-metrics.yaml.
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels: {clientId: "$3", topic: "$4", partition: "$5"}
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels: {clientId: "$3", broker: "$4:$5"}
      - pattern: kafka.server<type=(.+), cipher=(.+), protocol=(.+), listener=(.+), networkProcessor=(.+)><>connections
        name: kafka_server_$1_connections_tls_info
        type: GAUGE
        labels: {cipher: "$2", protocol: "$3", listener: "$4", networkProcessor: "$5"}
      - pattern: kafka.server<type=(.+), clientSoftwareName=(.+), clientSoftwareVersion=(.+), listener=(.+), networkProcessor=(.+)><>connections
        name: kafka_server_$1_connections_software
        type: GAUGE
        labels: {clientSoftwareName: "$2", clientSoftwareVersion: "$3", listener: "$4", networkProcessor: "$5"}
      - pattern: "kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+-total):"
        name: kafka_server_$1_$4
        type: COUNTER
        labels: {listener: "$2", networkProcessor: "$3"}
      - pattern: "kafka.server<type=(.+), listener=(.+), networkProcessor=(.+)><>(.+):"
        name: kafka_server_$1_$4
        type: GAUGE
        labels: {listener: "$2", networkProcessor: "$3"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+), (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
        labels: {"$4": "$5", "$6": "$7"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*, (.+)=(.+)><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
        labels: {"$4": "$5"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)PerSec\w*><>Count
        name: kafka_$1_$2_$3_total
        type: COUNTER
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+), (.+)=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
        labels: {"$4": "$5", "$6": "$7"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
        labels: {"$4": "$5"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>Value
        name: kafka_$1_$2_$3
        type: GAUGE
      - pattern: kafka.(\w+)<type=(.+), name=(.+), (.+)=(.+)><>(\d+)thPercentile
        name: kafka_$1_$2_$3
        type: GAUGE
        labels: {"$4": "$5", quantile: "0.$6"}
      - pattern: kafka.(\w+)<type=(.+), name=(.+)><>(\d+)thPercentile
        name: kafka_$1_$2_$3
        type: GAUGE
        labels: {quantile: "0.$4"}
      - pattern: "kafka.server<type=raft-metrics><>(.+-total|.+-max):"
        name: kafka_server_raftmetrics_$1
        type: COUNTER
      - pattern: "kafka.server<type=raft-metrics><>(current-state): (.+)"
        name: kafka_server_raftmetrics_$1
        value: 1
        type: UNTYPED
        labels: {$1: "$2"}
      - pattern: "kafka.server<type=raft-metrics><>(.+):"
        name: kafka_server_raftmetrics_$1
        type: GAUGE
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: medallion
spec:
  replicas: 1
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 10Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 1536Mi}
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 768m
  template:
    pod:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9404"
          prometheus.io/path: /metrics
          medallion.io/component: kafka
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: medallion
  namespace: kafka
spec:
  kafka:
    version: 4.3.2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      auto.create.topics.enable: false
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      log.retention.hours: 168
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef: {name: kafka-metrics, key: kafka-metrics-config.yml}
  entityOperator:
    topicOperator:
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 384Mi}
    userOperator:
      resources:
        requests: {cpu: 50m, memory: 192Mi}
        limits: {memory: 384Mi}
  # Kafka Exporter: topic offsets and consumer-group lag (used for the bronze sink lag and HWM backlog panels).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests: {cpu: 20m, memory: 64Mi}
      limits: {memory: 128Mi}
    template:
      pod:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9404"
            prometheus.io/path: /metrics
            medallion.io/component: kafka-exporter
---
# The CDC topic. key = the User's _id, so all Change Events of one User land in one partition
# and the Kafka offset is a valid tie-break inside the Event Position.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: cdc.app.users
  namespace: kafka
  labels:
    strimzi.io/cluster: medallion
spec:
  topicName: cdc.app.users
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    cleanup.policy: delete
