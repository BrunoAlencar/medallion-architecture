# Kafka Connect (custom image: Debezium MongoDB source + Aiven S3 sink, see images/kafka-connect).
# JsonConverter with embedded schemas, no Schema Registry (ADR-0004).
apiVersion: v1
kind: ConfigMap
metadata:
  name: connect-metrics
  namespace: kafka
data:
  connect-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      # ---- Connector / task status (string attributes -> value 1 with a status label)
      - pattern: "kafka.connect<type=connector-metrics, connector=(.+)><>status: ([a-z-]+)"
        name: kafka_connect_connector_status
        value: 1
        type: GAUGE
        labels: {connector: "$1", status: "$2"}
      - pattern: "kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>status: ([a-z-]+)"
        name: kafka_connect_connector_task_status
        value: 1
        type: GAUGE
        labels: {connector: "$1", task: "$2", status: "$3"}
      # ---- Per-task numeric metrics: source-task, sink-task, connector-task, task-error
      - pattern: "kafka.connect<type=(source-task|sink-task|connector-task|task-error)-metrics, connector=(.+), task=(.+)><>([a-z-]+)"
        name: kafka_connect_$1_$4
        type: GAUGE
        labels: {connector: "$2", task: "$3"}
      # ---- Worker-level metrics
      - pattern: "kafka.connect<type=connect-worker-metrics, connector=(.+)><>([a-z-]+)"
        name: kafka_connect_worker_connector_$2
        type: GAUGE
        labels: {connector: "$1"}
      - pattern: "kafka.connect<type=connect-worker-metrics><>([a-z-]+)"
        name: kafka_connect_worker_$1
        type: GAUGE
      - pattern: "kafka.connect<type=connect-worker-rebalance-metrics><>([a-z-]+)"
        name: kafka_connect_worker_rebalance_$1
        type: GAUGE
      # ---- Consumer lag of the sink tasks
      - pattern: "kafka.consumer<type=consumer-fetch-manager-metrics, client-id=(.+), topic=(.+), partition=(.+)><>(records-lag|records-lead)"
        name: kafka_connect_consumer_$4
        type: GAUGE
        labels: {client_id: "$1", topic: "$2", partition: "$3"}
      # ---- Debezium MongoDB connector (context = snapshot | streaming, server = topic.prefix)
      - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^,]+), task=([^>]+)><>([A-Za-z]+)"
        name: debezium_metrics_$5
        type: GAUGE
        labels: {plugin: "$1", context: "$2", server: "$3", task: "$4"}
      - pattern: "debezium.([^:]+)<type=connector-metrics, server=([^,]+), task=([^,]+), context=([^>]+)><>([A-Za-z]+)"
        name: debezium_metrics_$5
        type: GAUGE
        labels: {plugin: "$1", server: "$2", task: "$3", context: "$4"}
      - pattern: "debezium.([^:]+)<type=connector-metrics, context=([^,]+), server=([^>]+)><>([A-Za-z]+)"
        name: debezium_metrics_$4
        type: GAUGE
        labels: {plugin: "$1", context: "$2", server: "$3"}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaConnect
metadata:
  name: medallion-connect
  namespace: kafka
  annotations:
    strimzi.io/use-connector-resources: "true"
spec:
  version: 4.3.2
  replicas: 1
  image: medallion/kafka-connect:dev
  bootstrapServers: medallion-kafka-bootstrap:9092
  # In the v1 API these replace group.id / *.storage.topic inside spec.config (now forbidden there).
  groupId: medallion-connect
  configStorageTopic: medallion-connect-configs
  offsetStorageTopic: medallion-connect-offsets
  statusStorageTopic: medallion-connect-status
  config:
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: true
    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: true
    # The Aiven sink writes one file per partition per flush. 15 s keeps bronze fresh in a demo.
    offset.flush.interval.ms: 15000
    # ${env:VAR} in connector configs resolves from the container env below (no secrets in CRs).
    config.providers: env
    config.providers.env.class: org.apache.kafka.common.config.provider.EnvVarConfigProvider
  resources:
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 1536Mi}
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 768m
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef: {name: connect-metrics, key: connect-metrics-config.yml}
  template:
    pod:
      metadata:
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "9404"
          prometheus.io/path: /metrics
          medallion.io/component: kafka-connect
    connectContainer:
      env:
        - name: S3_ACCESS_KEY
          valueFrom: {secretKeyRef: {name: medallion-credentials, key: S3_ACCESS_KEY}}
        - name: S3_SECRET_KEY
          valueFrom: {secretKeyRef: {name: medallion-credentials, key: S3_SECRET_KEY}}
        - name: S3_REGION
          valueFrom: {secretKeyRef: {name: medallion-credentials, key: S3_REGION}}
---
# Stable address for Connect's Prometheus endpoint. The seeder polls it to learn when the
# Debezium snapshot has completed (debezium_metrics_snapshotcompleted == 1).
apiVersion: v1
kind: Service
metadata:
  name: connect-metrics
  namespace: kafka
spec:
  selector:
    strimzi.io/name: medallion-connect-connect
  ports:
    - {name: metrics, port: 9404, targetPort: 9404}
---
# Strimzi's generated NetworkPolicy opens the Connect REST API (8083) only to the Connect pods and
# the cluster operator, and kind enforces NetworkPolicies. NetworkPolicies add up, so this one also
# lets Kafka UI (its Kafka Connect page) and `make status` probe pods (label medallion.io/probe=true,
# any namespace) in. `make ui` port-forwards need no rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: medallion-connect-rest-access
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/name: medallion-connect-connect
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-ui
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              medallion.io/probe: "true"
      ports:
        - {port: 8083, protocol: TCP}
