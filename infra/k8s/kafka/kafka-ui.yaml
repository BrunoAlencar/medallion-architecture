# Kafka UI (kafbat): browse topics/messages, consumer groups and Kafka Connect connectors.
# `make ui` port-forwards it to http://localhost:8081.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-ui-config
  namespace: kafka
data:
  config.yml: |
    kafka:
      clusters:
        - name: medallion
          bootstrapServers: medallion-kafka-bootstrap.kafka.svc.cluster.local:9092
          kafkaConnect:
            - name: medallion-connect
              address: http://medallion-connect-connect-api.kafka.svc.cluster.local:8083
          readOnly: false
    dynamic.config.enabled: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kafka-ui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kafka-ui}
    spec:
      containers:
        - name: kafka-ui
          image: ghcr.io/kafbat/kafka-ui:v1.5.0
          env:
            - {name: SPRING_CONFIG_ADDITIONAL-LOCATION, value: /etc/kafka-ui/config.yml}
            - {name: JAVA_OPTS, value: "-Xmx256m"}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/kafka-ui}
      volumes:
        - name: config
          configMap: {name: kafka-ui-config}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: kafka
spec:
  selector: {app.kubernetes.io/name: kafka-ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
