# Mimir 3.2.3 monolithic (-target=all) from a hand-written manifest: there is no single-binary chart,
# and mimir-distributed turns on Kafka ingest storage. Classic architecture, blocks on s3://mimir.
# The ruler loads infra/k8s/alerts/medallion-alerts.yaml (ConfigMap mimir-rules, created by the Makefile)
# and fires into Mimir's built-in Alertmanager, which has no receivers (alerts are only *shown* in Grafana).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mimir-config
  namespace: observability
data:
  mimir.yaml: |
    # `all` doesn't include the Alertmanager; without it the ruler's alerts get 404 ("Error sending
    # alerts") and Grafana's Mimir Alertmanager data source has nothing to show.
    target: all,alertmanager
    multitenancy_enabled: false
    usage_stats:
      enabled: false
    server:
      http_listen_port: 9009
      grpc_listen_port: 9095
      log_level: warn
    # Classic architecture (ingesters with a local WAL); no Kafka.
    ingest_storage:
      enabled: false
    common:
      storage:
        backend: s3
        s3:
          endpoint: seaweedfs-s3.data.svc.cluster.local:8333
          bucket_name: mimir
          region: ${S3_REGION}
          access_key_id: ${S3_ACCESS_KEY}
          secret_access_key: ${S3_SECRET_KEY}
          insecure: true
    blocks_storage:
      storage_prefix: blocks
      tsdb:
        dir: /data/tsdb
      bucket_store:
        sync_dir: /data/tsdb-sync
    alertmanager_storage:
      storage_prefix: alertmanager
    ruler_storage:
      backend: local
      local:
        directory: /etc/mimir/rules
    compactor:
      data_dir: /data/compactor
      sharding_ring:
        kvstore: {store: memberlist}
    distributor:
      ring:
        instance_addr: 127.0.0.1
        kvstore: {store: memberlist}
    ingester:
      ring:
        instance_addr: 127.0.0.1
        kvstore: {store: memberlist}
        replication_factor: 1
    store_gateway:
      sharding_ring:
        replication_factor: 1
    ruler:
      rule_path: /data/ruler
      alertmanager_url: http://127.0.0.1:9009/alertmanager
      enable_api: true
      evaluation_interval: 30s
    alertmanager:
      data_dir: /data/alertmanager
      external_url: http://localhost:9009/alertmanager
      fallback_config_file: /etc/mimir/alertmanager-fallback.yaml
      sharding_ring:
        replication_factor: 1
    limits:
      max_global_series_per_user: 300000
      ingestion_rate: 50000
      ingestion_burst_size: 500000
      compactor_blocks_retention_period: 7d
  alertmanager-fallback.yaml: |
    # No notification channel on purpose (PLAN: alerts are visible in Grafana only).
    route:
      receiver: grafana-only
      group_by: [alertname]
    receivers:
      - name: grafana-only
---
apiVersion: v1
kind: Service
metadata:
  name: mimir
  namespace: observability
spec:
  selector: {app.kubernetes.io/name: mimir}
  ports:
    - {name: http, port: 9009, targetPort: 9009}
    - {name: grpc, port: 9095, targetPort: 9095}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir
  namespace: observability
spec:
  serviceName: mimir
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mimir}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mimir}
    spec:
      containers:
        - name: mimir
          image: grafana/mimir:3.2.3
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
          envFrom:
            - secretRef: {name: medallion-credentials}
          ports:
            - {name: http, containerPort: 9009}
            - {name: grpc, containerPort: 9095}
          readinessProbe:
            httpGet: {path: /ready, port: 9009}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: config, mountPath: /etc/mimir/mimir.yaml, subPath: mimir.yaml}
            - {name: config, mountPath: /etc/mimir/alertmanager-fallback.yaml, subPath: alertmanager-fallback.yaml}
            - {name: rules, mountPath: /etc/mimir/rules/anonymous}
            - {name: data, mountPath: /data}
      volumes:
        - name: config
          configMap: {name: mimir-config}
        - name: rules
          configMap: {name: mimir-rules, optional: true}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 5Gi}}
