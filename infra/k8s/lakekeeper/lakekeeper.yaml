# Iceberg REST catalog for silver (the local stand-in for the AWS Glue Data Catalog).
# Postgres 17 holds catalog state; Lakekeeper serves REST on :8181 (/catalog, /management, /ui)
# and Prometheus metrics on :9000.
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper-postgres
  namespace: data
spec:
  selector: {app.kubernetes.io/name: lakekeeper-postgres}
  ports:
    - {name: postgres, port: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lakekeeper-postgres
  namespace: data
spec:
  serviceName: lakekeeper-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lakekeeper-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lakekeeper-postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: lakekeeper}
            - {name: POSTGRES_DB, value: lakekeeper}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: medallion-credentials, key: LAKEKEEPER_PG_PASSWORD}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "lakekeeper"]}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: data
spec:
  selector: {app.kubernetes.io/name: lakekeeper}
  ports:
    - {name: http, port: 8181}
    - {name: metrics, port: 9000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: lakekeeper}
  template:
    metadata:
      labels: {app.kubernetes.io/name: lakekeeper}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
        medallion.io/component: lakekeeper
    spec:
      initContainers:
        - name: migrate
          image: quay.io/lakekeeper/catalog:v0.14.2
          args: ["migrate"]
          env: &lakekeeper-env
            - name: PG_PASSWORD
              valueFrom: {secretKeyRef: {name: medallion-credentials, key: LAKEKEEPER_PG_PASSWORD}}
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: postgresql://lakekeeper:$(PG_PASSWORD)@lakekeeper-postgres.data.svc.cluster.local:5432/lakekeeper
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: postgresql://lakekeeper:$(PG_PASSWORD)@lakekeeper-postgres.data.svc.cluster.local:5432/lakekeeper
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              valueFrom: {secretKeyRef: {name: medallion-credentials, key: LAKEKEEPER_ENCRYPTION_KEY}}
            - {name: LAKEKEEPER__AUTHZ_BACKEND, value: allowall}
            - {name: LAKEKEEPER__METRICS_PORT, value: "9000"}
            - {name: RUST_LOG, value: info}
      containers:
        - name: lakekeeper
          image: quay.io/lakekeeper/catalog:v0.14.2
          args: ["serve"]
          env: *lakekeeper-env
          ports:
            - {name: http, containerPort: 8181}
            - {name: metrics, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /health, port: 8181}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 384Mi}
---
# Bootstraps Lakekeeper and creates the `medallion` warehouse on s3://silver/warehouse, or, if it
# exists, re-applies its storage profile (so profile changes reach running clusters).
# sts-enabled: Lakekeeper vends short-lived credentials from RustFS STS. It signs in as the IAM user
# `lakekeeper` (silver bucket only, created by the rustfs-init Job), not as root, so the vended
# credentials can't reach other buckets. RustFS accepts but ignores sts-role-arn (kept so the profile
# has the same shape as on AWS). The Lakekeeper UI needs these credentials to list a table's files.
# Idempotent: safe to re-run with `make up-core`.
apiVersion: batch/v1
kind: Job
metadata:
  name: lakekeeper-warehouse
  namespace: data
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: curlimages/curl:8.11.1
          envFrom:
            - secretRef: {name: medallion-credentials}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              LK=http://lakekeeper.data.svc.cluster.local:8181
              until curl -sf $LK/health >/dev/null; do echo "waiting for lakekeeper"; sleep 3; done
              # Bootstrap is one-shot; a second call answers 4xx, which is fine.
              curl -s -X POST $LK/management/v1/bootstrap -H 'Content-Type: application/json' \
                -d '{"accept-terms-of-use": true}' || true
              cat > /tmp/storage.json <<EOF
                "storage-profile": {
                  "type": "s3",
                  "bucket": "silver",
                  "key-prefix": "warehouse",
                  "region": "${S3_REGION}",
                  "endpoint": "http://rustfs.data.svc.cluster.local:9000",
                  "path-style-access": true,
                  "flavor": "s3-compat",
                  "sts-enabled": true,
                  "sts-role-arn": "arn:aws:iam::000000000000:role/LakekeeperVendedRole"
                },
                "storage-credential": {
                  "type": "s3",
                  "credential-type": "access-key",
                  "aws-access-key-id": "${LAKEKEEPER_S3_ACCESS_KEY}",
                  "aws-secret-access-key": "${LAKEKEEPER_S3_SECRET_KEY}"
                }
              EOF
              # The list answers {"warehouses":[{"id":"…","warehouse-id":"…","name":"medallion",…}]}
              WH_ID="$(curl -sf $LK/management/v1/warehouse | tr ',' '\n' \
                | grep -B2 '"name":"medallion"' | sed -n 's/.*"id":"\([^"]*\)".*/\1/p' | head -1)"
              if [ -n "$WH_ID" ]; then
                { echo '{'; cat /tmp/storage.json; echo '}'; } > /tmp/update.json
                curl -sf -X POST "$LK/management/v1/warehouse/$WH_ID/storage" \
                  -H 'Content-Type: application/json' -d @/tmp/update.json >/dev/null
                echo "warehouse medallion exists ($WH_ID): storage profile re-applied"
                exit 0
              fi
              { echo '{"warehouse-name": "medallion", "delete-profile": {"type": "hard"},'; cat /tmp/storage.json; echo '}'; } > /tmp/wh.json
              curl -sf -X POST $LK/management/v1/warehouse -H 'Content-Type: application/json' -d @/tmp/wh.json
              echo; echo "warehouse medallion created"
