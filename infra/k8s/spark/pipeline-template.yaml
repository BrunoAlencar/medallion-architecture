# Rendered by scripts/run-pipeline.sh (placeholders __NAME__, __RUN_ID__, __STEPS__).
# One SparkApplication runs the whole Pipeline in order: bronze_to_silver -> checks -> silver_to_gold
# (ADR-0006). Other steps (verify, fingerprint, reset-hwm) reuse the same template.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: __NAME__
  namespace: processing
  labels:
    app.kubernetes.io/part-of: medallion
    medallion.io/run-id: "__RUN_ID__"
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: medallion/spark:dev
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/medallion/apps/pipeline/run_pipeline.py
  arguments: ["--steps", "__STEPS__", "--run-id", "__RUN_ID__"]
  sparkVersion: 4.1.4
  timeToLiveSeconds: 86400
  restartPolicy:
    type: Never
  sparkConf:
    spark.ui.prometheus.enabled: "true"
    spark.metrics.conf.*.sink.prometheusServlet.class: org.apache.spark.metrics.sink.PrometheusServlet
    spark.metrics.conf.*.sink.prometheusServlet.path: /metrics/prometheus
    spark.sql.session.timeZone: UTC
    # UDFs import apps.pipeline.transform on executors (merged with the pyspark paths by Spark)
    spark.executorEnv.PYTHONPATH: /opt/medallion
    spark.sql.shuffle.partitions: "6"
    spark.kubernetes.driver.annotation.prometheus.io/scrape: "true"
    spark.kubernetes.driver.annotation.prometheus.io/port: "4040"
    spark.kubernetes.driver.annotation.prometheus.io/path: /metrics/prometheus/
    spark.kubernetes.driver.annotation.medallion.io/component: spark-driver
  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark
    labels:
      medallion.io/run-id: "__RUN_ID__"
      medallion.io/component: pipeline
    envFrom:
      - secretRef: {name: medallion-credentials}
      - configMapRef: {name: pipeline-config}
  executor:
    cores: 1
    instances: 1
    memory: 1g
    labels:
      medallion.io/run-id: "__RUN_ID__"
      medallion.io/component: pipeline
    envFrom:
      - secretRef: {name: medallion-credentials}
      - configMapRef: {name: pipeline-config}
