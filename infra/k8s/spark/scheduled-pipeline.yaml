# Runs the Pipeline every minute, so gold keeps up with the seeder. On from `make up`.
# `make schedule-off` pauses it; `make schedule-on [EVERY=10m]` resumes it (optionally at another interval).
# Forbid: if a run is still going when the next is due, that one is skipped (runs never overlap).
# Before the sink has written bronze, a run finds no files and just succeeds.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: ScheduledSparkApplication
metadata:
  name: medallion-pipeline-scheduled
  namespace: processing
spec:
  schedule: "@every 1m"
  concurrencyPolicy: Forbid
  suspend: false
  successfulRunHistoryLimit: 3
  failedRunHistoryLimit: 3
  template:
    type: Python
    pythonVersion: "3"
    mode: cluster
    image: medallion/spark:dev
    imagePullPolicy: IfNotPresent
    mainApplicationFile: local:///opt/medallion/apps/pipeline/run_pipeline.py
    # No --run-id: the Pipeline generates one per run.
    arguments: ["--steps", "pipeline"]
    sparkVersion: 4.1.4
    restartPolicy:
      type: Never
    sparkConf:
      spark.ui.prometheus.enabled: "true"
      spark.sql.session.timeZone: UTC
      # UDFs import apps.pipeline.transform on executors (merged with the pyspark paths by Spark)
      spark.executorEnv.PYTHONPATH: /opt/medallion
      spark.sql.shuffle.partitions: "6"
    driver:
      cores: 1
      memory: 1g
      serviceAccount: spark
      labels:
        medallion.io/component: pipeline
        medallion.io/run-id: scheduled
      envFrom:
        - secretRef: {name: medallion-credentials}
        - configMapRef: {name: pipeline-config}
    executor:
      cores: 1
      instances: 1
      memory: 1g
      labels:
        medallion.io/component: pipeline
      envFrom:
        - secretRef: {name: medallion-credentials}
        - configMapRef: {name: pipeline-config}
