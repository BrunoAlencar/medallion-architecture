# SeaweedFS all-in-one (master + volume + filer + S3 gateway) as the local stand-in for Amazon S3.
# Path-style S3 on http://seaweedfs-s3.data.svc.cluster.local:8333.
# Buckets: bronze silver gold loki tempo mimir (created by the seaweedfs-buckets Job below).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
  labels: {app.kubernetes.io/name: seaweedfs}
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: master, port: 9333}
    - {name: master-grpc, port: 19333}
    - {name: volume, port: 8080}
    - {name: volume-grpc, port: 18080}
    - {name: filer, port: 8888}
    - {name: filer-grpc, port: 18888}
    - {name: s3, port: 8333}
    - {name: metrics, port: 9327}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: data
  labels: {app.kubernetes.io/name: seaweedfs}
spec:
  selector: {app.kubernetes.io/name: seaweedfs}
  ports:
    - {name: s3, port: 8333, targetPort: 8333}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: data
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seaweedfs}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seaweedfs}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9327"
        prometheus.io/path: /metrics
        medallion.io/component: seaweedfs
    spec:
      initContainers:
        # Renders the S3 identity file from the shared Secret so no key is stored in a ConfigMap.
        - name: render-s3-config
          image: chrislusf/seaweedfs:4.52
          command: ["/bin/sh", "-c"]
          args:
            - |
              cat > /etc/seaweedfs/s3.json <<EOF
              {"identities":[{"name":"medallion","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],
                "actions":["Admin","Read","List","Tagging","Write"]}]}
              EOF
          envFrom:
            - secretRef: {name: medallion-credentials}
          volumeMounts:
            - {name: s3-config, mountPath: /etc/seaweedfs}
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52
          args:
            - server
            - -dir=/data
            - -ip.bind=0.0.0.0
            - -master.volumeSizeLimitMB=256
            - -volume.max=200
            - -filer
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -metricsPort=9327
          ports:
            - {name: master, containerPort: 9333}
            - {name: volume, containerPort: 8080}
            - {name: filer, containerPort: 8888}
            - {name: s3, containerPort: 8333}
            - {name: metrics, containerPort: 9327}
          readinessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs}
      volumes:
        - name: s3-config
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 30Gi}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-buckets
  namespace: data
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: create-buckets
          image: chrislusf/seaweedfs:4.52
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              SHELL_ARGS="-master=seaweedfs-0.seaweedfs.data.svc.cluster.local:9333 -filer=seaweedfs-0.seaweedfs.data.svc.cluster.local:8888"
              for b in bronze silver gold loki tempo mimir; do
                echo "s3.bucket.create -name $b" | weed shell $SHELL_ARGS || true
              done
              echo "s3.bucket.list" | weed shell $SHELL_ARGS | tee /tmp/buckets
              for b in bronze silver gold loki tempo mimir; do
                grep -q "$b" /tmp/buckets || { echo "bucket $b missing"; exit 1; }
              done
              echo "all buckets present"
