# StarRocks 4.1.7 shared-data: 1 FE + 1 CN, data on s3://gold via a storage volume created by
# the starrocks-init Job (enable_load_volume_from_conf=false keeps S3 keys out of this ConfigMap).
# Serves gold only (ADR-0003/0005). Operator: starrocks/operator chart 1.11.8.
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-fe-cm
  namespace: data
data:
  fe.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS = "-Dlog4j2.formatMsgNoLookups=true -Xms512m -Xmx1024m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = 8030
    rpc_port = 9020
    query_port = 9030
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
    run_mode = shared_data
    cloud_native_meta_port = 6090
    enable_load_volume_from_conf = false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-cn-cm
  namespace: data
data:
  cn.conf: |
    sys_log_level = INFO
    thrift_port = 9060
    webserver_port = 8040
    heartbeat_service_port = 9050
    brpc_port = 8060
    mem_limit = 1800M
    starlet_port = 9070
---
apiVersion: starrocks.com/v1
kind: StarRocksCluster
metadata:
  name: starrocks
  namespace: data
spec:
  starRocksFeSpec:
    image: starrocks/fe-ubuntu:4.1.7
    replicas: 1
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 1792Mi}
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8030"
      prometheus.io/path: /metrics
      medallion.io/component: starrocks-fe
    configMapInfo:
      configMapName: starrocks-fe-cm
      resolveKey: fe.conf
    storageVolumes:
      - name: fe-meta
        storageSize: 5Gi
        mountPath: /opt/starrocks/fe/meta
      - name: fe-log
        storageSize: 2Gi
        mountPath: /opt/starrocks/fe/log
  starRocksCnSpec:
    image: starrocks/cn-ubuntu:4.1.7
    replicas: 1
    requests: {cpu: 250m, memory: 1Gi}
    limits: {memory: 2560Mi}
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8040"
      prometheus.io/path: /metrics
      medallion.io/component: starrocks-cn
    configMapInfo:
      configMapName: starrocks-cn-cm
      resolveKey: cn.conf
    storageVolumes:
      - name: cn-cache
        storageSize: 5Gi
        mountPath: /opt/starrocks/cn/storage
      - name: cn-log
        storageSize: 2Gi
        mountPath: /opt/starrocks/cn/log
