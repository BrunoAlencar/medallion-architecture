# kind cluster shaped like a small EKS cluster: one control plane and two worker "node groups".
# The node-group labels mirror eks.amazonaws.com/nodegroup so manifests could later pin workloads.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: medallion
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      medallion.io/node-group: streaming
  - role: worker
    image: kindest/node:v1.37.0
    labels:
      medallion.io/node-group: analytics
